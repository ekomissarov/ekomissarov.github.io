baseURL = 'https://ekomissarov.github.io/'
languageCode = 'en-us'
title = 'Eugene Komissarov'
theme = 'PaperMod'

# Основные настройки
enableRobotsTXT = true

[params]
    author = 'Eugene Komissarov'
    description = 'Data & Experimentation Architecture, Engineering and Research'
    defaultTheme = 'auto'
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    mainSections = ['posts']
    ShowRssButtonInSectionTermList = true

# Главная страница
[params.homeInfoParams]
    Title = 'Eugene Komissarov'
    Content = '''
**Product Analytics · Experimentation · Data Science**

I work at the intersection of product analytics,
experimental design, and data engineering.

My focus is on building reliable experimentation
processes, measuring product impact, and turning
complex data into actionable decisions.

On this website, I share technical articles,
research notes, and engineering projects.
'''

