baseURL = 'https://ekomissarov.github.io/'
languageCode = 'en-us'
title = 'Eugene Komissarov'
theme = 'PaperMod'

# Основные настройки
enableRobotsTXT = true

[params]
    author = 'Eugene Komissarov'
    description = 'Product analytics, experimentation, causal inference, and the engineering behind reliable analytical systems.'
    defaultTheme = 'auto'
    ShowReadingTime = false 
    ShowShareButtons = false 
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = false 
    mainSections = ['posts']
    ShowRssButtonInSectionTermList = true

# Главная страница
[params.homeInfoParams]
    Title = 'Eugene Komissarov'
    Content = '''
**Product Analytics · Experimentation · Causal Inference**

Exploring the statistics, engineering, and architecture
behind reliable product experimentation.

I write about experimental design, statistical methods,
causal inference, and the engineering challenges
of building trustworthy analytical systems.
'''

